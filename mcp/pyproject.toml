[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "desktop-canvas-mcp"
version = "0.1.0"
description = "MCP server for the OpenCanvas desktop app (native Rust/Slint canvas)"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "mcp[cli]>=2.2.0,<3",
]

[project.scripts]
desktop-canvas-mcp = "desktop_canvas_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/desktop_canvas_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/desktop_canvas_mcp/instructions.md" = "desktop_canvas_mcp/instructions.md"

[tool.ruff]
target-version = "py312"
line-length = 140
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Chinese tool descriptions are intentional.
ignore = ["RUF001", "RUF002", "RUF003"]
